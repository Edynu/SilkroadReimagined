# SroGame.cfg - the game server's settings (copy this file next to SroGame.exe as SroGame.cfg, or put these keys in
# the shard's file, deploy/shard.example.cfg, which every game server of the shard reads with --config).
# Every key can also be given on the command line as --key value (a switch alone, --event-ctf, is "true").
# '#' starts a comment line. A value with a comment after it on its line is not read: keep comments on their own lines.
# A key shown with '#' before it is off or at its default: remove the '#' to set it.

# --- Rates: 1 is the original's, 2 twice as much (or twice as often), 0.5 half ------------------

# Experience and skill experience (SP) from killing monsters.
rate-exp = 1
rate-sp = 1

# Gold: how much a drop holds (levelgold.txt's range times this), and how often gold drops.
rate-gold = 1
rate-drop-gold = 1

# How often each kind of item drops:
# equipment: weapons, armour, shields, accessories
rate-drop-equipment = 1
# sox: Seal of Star / Moon / Sun (rare) equipment
rate-drop-sox = 1
# material: alchemy materials, magic and attribute stones, tablets
rate-drop-material = 1
# elixir: the reinforcement elixirs
rate-drop-elixir = 1
# potion: potions, cures, return scrolls, arrows and bolts
rate-drop-potion = 1

# The highest level a character can reach.
level-cap = 110

# The PK switch: true, no player attacks an innocent nor a hostile job (free PvP
# and guild wars stay). Off by default: PK allowed.
pk-prohibited = false

# --- Events --------------------------------------------------------------------------------------
# Off unless switched on here (the original's events ran only when its operator switched them on). Every game
# server of a shard should have the same values: put them in the shard's file.

# Capture the Flag and Event So-Ok's registration: the plays' starts (24-hour
# clock, the server's time), registration open the 10 minutes before each; a match needs ctf-min-players.
event-ctf = false
# ctf-times = 20:00,22:00
# ctf-min-players = 2

# The Battle Arena: its rounds as the original's _Schedule rows 16..23 say.
event-arena = false

# --- Characters ----------------------------------------------------------------------------------

# Characters an account may have on this server, and the days a deleted one can still be restored.
# max-characters = 3
# delete-days = 7

# --- The world ------------------------------------------------------------------------------------

# The world's updates a second, and a zone's width in regions (the zones run on the workers).
# tick-rate = 20
# zone-regions = 16
# How often the world's tick times are logged, in seconds (0: never).
# stats-seconds = 10

# Where the items, characters, skills, teleports, shops, levels and quests come from: "database" (the
# original's tables in the database, the default) or "client" (the game files' text tables).
# tables = database
# The game files (the client's folder; default: the SR_GAME_DIR environment variable).
# game = E:\Silkroad\VSRO_Client

# The monsters' drops and nests from files instead of the database (tools/scripts/monster_drops.py,
# monster_nests.py); the NPCs' facing (tools/scripts/npc_headings.py).
# monster-drops = monster_drops.tsv
# monster-nests = monster_nests.tsv
# npc-headings = npc_headings.tsv

# --- The database --------------------------------------------------------------------------------

# This shard's schema in the database: its characters, items and reference tables.
# A second shard names another (SroDb --import --shard-schema puts an original shard's tables there).
# The database's address is never kept here: set SR_DB_URL (or give --db on the command line).
# shard-schema = sro_vt_shard

# --- This server, players and the network ---------------------------------------------------------

# Its number in the shard (the shard's file names its areas: server.N.regions), how it is listed, the address
# players are sent to, where it listens.
# id = 1
# server-name = Silkroad
# public-host = 127.0.0.1
# listen = 0.0.0.0
# port = 15781

# The TLS certificate players' connections use; dev-certificate makes a self-signed one for tls-name when the
# files are missing (development only).
# certificate = dev/server.pem
# key = dev/server.key
# dev-certificate = false
# tls-name = localhost

# Players at most on this server and in the whole shard, and the threads: workers run the zones and the
# navigation (default: every core), net-threads the sockets.
# capacity = 3000
# shard-capacity = 3000
# workers = 9
# net-threads = 2

# --- Views: who each player sees, and how often ------------------------------------------------------
# A player sees what is within view-radius (the minimap's units; a region is 192), nearest first, up
# to each kind's share; a share's unused places go to the other kinds' nearest. NPCs are always seen.
# The nearest view-tier1 hear of every step at once (20 times a second), the next view-tier2 every
# 2nd tick, the rest every 4th; fights are told to the near ones first. view-keep keeps what is seen
# a little past the edge and the shares (0.1 = 10%), so a crowd's border does not flicker.
# Each player can lower their own view in the client (Option, Online); never above these.
#
# What it costs (measured: 1,000 bots in one spot, all walking and fighting, 6 cores, 20 ticks):
#   small    radius 400, 150 / 100 / 30, tiers 75 / 75      a modest machine or uplink
#   default  radius 600, 300 / 150 / 50, tiers 150 / 150    ~13 ms a tick, ~9 KB/s a player in a crowd
#   big      radius 600, 600 / 400 / 100, tiers 150 / 150   ~15-17 ms a tick, ~18 KB/s a player in a crowd
# A tick must stay under 50 ms; the log line "world: ..." every stats-seconds shows it.
# view-radius = 600
# view-players = 300
# view-monsters = 150
# view-items = 50
# view-tier1 = 150
# view-tier2 = 150
# view-keep = 0.1

# --- Development and tries (never on a live shard) ---------------------------------------------------

# Developer commands: the client's F1 teleports, the GM's /give, /quest done, /siege, /flagworld, /arena
# switches, the skill and item labs' setup.
dev-commands = false

# Shorter cycles for tries, each in seconds and again and again from the start (instead of the clock):
# Capture the Flag: registration, play, the winners' time
# ctf-cycle = 120,600,60
# The Battle Arena (random mode): registration, play
# arena-cycle = 120,600
# The fortress war: applications, a gap, the war
# fortress-cycle = 300,60,1800
# Every fortress structure's most health (0: characterdata's)
# fortress-structure-hp = 0
# The jobs' bandits: each wave A + up to B seconds (the original's 60,60)
# bandit-seconds = 60,60
# A guild master's election, and a surrendered guild war's end
# guild-election-seconds = 600
# guild-war-end-seconds = 60
