# A shard's settings: the same file on every machine.
#
#   the front machine:  SroControl.exe --config shard.cfg      (gateway, login, control)
#   a game machine:     SroGame.exe --config shard.cfg --id 1
#   the website:        SroWeb.exe --config shard.cfg            (its API; behind a reverse proxy)
#
#   the setup, once:     SroSetup.exe --config shard.cfg          (docs/SERVER_SETUP.md 5)

shard-name = Silkroad

# The database (PostgreSQL; docs/SERVER_SETUP.md 3). The password is better kept out of this file: set the
# environment variable SR_DB_PASSWORD for the user running the servers (db-password here works too). A whole
# URL in SR_DB_URL (postgresql://sro:PASSWORD@host:5432/sro_live) wins over these. Keep the database closed
# to the internet: only the game machines' addresses may reach it.
db-host = 127.0.0.1
db-port = 5432
db-name = sro_live
db-user = sro
# db-password =

# Your own original files (the README's "What you need"): the vSRO 1.188 client folder (every game machine
# reads its maps and tables), and the folder with SRO_VT_SHARD.bak and Quest.sct (only SroSetup reads it).
game = C:\Games\vSRO_1188
data = data
# The servers' TLS certificate is made by SroSetup for this name (players connect to it).
tls-name = front.example.com

# The front machine. login-host is the address players connect to.
gateway-port = 15779
login-port = 15780
login-host = front.example.com

# Two game servers, the world split between them. Each area name is the game's own (_RefRegion's
# ContinentName). A name may end in * ; each area must have exactly one owner, or the server stops at
# start and says which.
server.1.name = East
server.1.public-host = east.example.com
server.1.port = 15781
server.1.regions = CHINA, West_China, Oasis_Kingdom, Roc, TQ, FORT_JA_AREA, FORT_HT_AREA, FORT_BJ_AREA, SIEGE_DUNGEON, Thief Village

server.2.name = West
server.2.public-host = west.example.com
server.2.port = 15781
server.2.regions = Eu, Am, Ca, DELTA, SD, KingsValley, Pharaoh, TEMPLE, GOD_*, ARENA_*

# The whole world on one machine: delete the two servers above and use this.
# server.1.name = World
# server.1.public-host = play.example.com
# server.1.port = 15781
# server.1.regions = *

# --- The game servers' settings (every game server of the shard reads them; server/game/SroGame.example.cfg
# explains every key, and any of them may be set here) -------------------------------------------------

# Rates: 1 is the original's.
rate-exp = 1
rate-sp = 1
rate-gold = 1
rate-drop-gold = 1
rate-drop-equipment = 1
rate-drop-sox = 1
rate-drop-material = 1
rate-drop-elixir = 1
rate-drop-potion = 1
level-cap = 110
# The PK switch: true, no player attacks an innocent nor a hostile job (free PvP and guild wars stay).
pk-prohibited = false
# The beta quests (game/BetaQuests.h): true, a Beta Helper (So-Ok's look) beside So-Ok in each town with ten quests that
# pay a bound Seal of Sun weapon (degrees 2..11) for quests finished, event matches, the Roc, the tomb and the fortress war.
# For a test shard only. beta-helpers = "REGION,X,Y,Z[,HEADING];..." places the helpers instead.
beta-quests = false

# Events: off unless switched on. Capture the Flag's plays start at ctf-times (registration the 10 minutes
# before); the Battle Arena runs the original's _Schedule rows 16..23.
event-ctf = false
# ctf-times = 20:00,22:00
# ctf-min-players = 2
# arena-min-players = 2   (tries: unset, the original's fewest by the match's group, 4 or 8)
event-arena = false

# Characters an account may have, the days a deleted one can be restored.
# max-characters = 3
# delete-days = 7

# Development only: the developer and GM commands (F1 teleports, /give, /quest done, /siege, /flagworld, /arena).
# A release build (CMake -DSR_DEV_COMMANDS=OFF) has none: there this setting is ignored.
dev-commands = false

# The servers' guards. Every server program reads them; loopback is never limited.
# connections-per-address = 8     # connections open at once from one address (0: no limit)
# connects-per-minute = 30        # new connections from one address within a minute (0: no limit)
# messages-per-second = 50        # a connection's message budget: filled this fast ...
# message-burst = 200             # ... up to this; a connection that empties it is closed (0 per second: none)
# address-attempts = 20           # login attempts per address a minute (0: none; start-dev.bat only)

# The oldest client let in (every server program; the gateway turns an older one away at its greeting, with a box that
# says where the new one is). The clients before 0.1.3 all name themselves 0.1: any floor turns them away.
# min-client-version = 0.1.3          # a fixed floor
# client-version-from-patch = true    # the floor follows the client SroDeploy published last (web-patch-dir's client.json),
#                                     # read again every minute: uploading a new client turns the older ones away
# client-download-url = https://play.example.com/download   # where the box sends the player

# The website's API (SroWeb.exe). It shows this file's shard-name, level-cap and
# rates. It listens on 127.0.0.1: put a reverse proxy (Caddy, nginx) in front for HTTPS and forward
# /api to it; with web-root it serves the built site too (website\dist, npm run build).
web-port = 15790
# web-root = C:\SroReimagined\website\dist
# web-trust-proxy = true          # the visitor's address from the proxy (X-Forwarded-For)
# web-site-url = https://play.example.com   # the site's address in /sitemap.xml and /robots.txt (unset: the request's host)
# web-beta-keys = true            # a closed beta: SroWeb --make-keys 50 --key-note "first wave"
# web-register-attempts = 5       # accounts tried per address an hour
# The administration at /admin (accounts: SroWeb --make-admin NAME, on this machine only). Behind HTTPS the
# session cookie is sent only over it; keep the admin API to your own addresses where you can.
# web-admin-allow = 127.0.0.1, 10.0.0.0/8
# web-files = C:\SroReimagined\web-files    # uploads: the header's pictures and the client
# web-upload-max-mb = 20480
