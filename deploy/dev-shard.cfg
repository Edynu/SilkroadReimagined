# The shard start-dev.bat runs: everything on this machine, the world in two.
# The same keys as deploy/shard.example.cfg; only the addresses differ.

shard-name = Silkroad
# The shard's players, both game servers together; each carries all of them (players gather where they like).
shard-capacity = 3000

gateway-port = 15779
login-port = 15780
login-host = 127.0.0.1

# The developer pages (/dev) without a login from this machine (SroWeb; never on a shard behind a reverse proxy).
web-dev-local = true

server.1.name = East
server.1.public-host = 127.0.0.1
server.1.port = 15781
server.1.regions = CHINA, West_China, Oasis_Kingdom, Roc, TQ, FORT_JA_AREA, FORT_HT_AREA, FORT_BJ_AREA, SIEGE_DUNGEON, Thief Village

server.2.name = West
server.2.public-host = 127.0.0.1
server.2.port = 15782
server.2.regions = Eu, Am, Ca, DELTA, SD, KingsValley, Pharaoh, TEMPLE, GOD_*, ARENA_*

# The game servers' settings (server/game/SroGame.example.cfg explains every key; any of them may be set here).
# Test rates for the dev shard (1 = the original's).
rate-exp = 10
rate-sp = 10
rate-gold = 10
rate-drop-gold = 10
rate-drop-equipment = 10
rate-drop-sox = 10
rate-drop-material = 10
rate-drop-elixir = 10
rate-drop-potion = 10
level-cap = 110
# The PK switch: true, no player attacks an innocent nor a hostile job (free PvP
# and guild wars stay). Off by default: PK allowed.
pk-prohibited = false
# The beta quests (game/BetaQuests.h): true, a Beta Helper (So-Ok's look) beside So-Ok in each town with ten quests that
# pay a bound Seal of Sun weapon (degrees 2..11) for quests finished, event matches, the Roc, the tomb and the fortress war.
# For a test shard only. beta-helpers = "REGION,X,Y,Z[,HEADING];..." places the helpers instead.
beta-quests = false
# The Beta Helpers' places (REGION,X,Y,Z,HEADING; a GM's /where gives them), ';' between them: Jangan, Donwhang, Hotan,
# Samarkand, Constantinople, Alexandria.
beta-helpers = 25000,1220.3,-32.6,1123.6,314;26265,1009.0,-106.8,1704.9,6;23687,1058.2,244.3,560.8,231;27499,1587.6,180.0,45.9,271;26959,833.0,83.7,657.7,31;23088,622.6,863.4,878.4,348

# Events. Capture the Flag: its plays start at ctf-times (the server's clock),
# registration the 10 minutes before; the GM's /flagworld OPEN | START | END | CANCEL at any time.
event-ctf = true
ctf-times = 20:00,22:00
# ctf-min-players = 2
# arena-min-players = 2   (tries: unset, the original's fewest by the match's group, 4 or 8)
# The Battle Arena: the original's _Schedule rows 16..23; the GM's /arena at any time.
event-arena = false

# Characters an account may have, the days a deleted one can be restored.
# max-characters = 3
# delete-days = 7

# Development: start-dev.bat passes --dev-commands to the game servers too.
dev-commands = true
# Shorter cycles for tries (seconds, again and again): Capture the Flag's registration, play, winners; the
# arena's registration, play; the fortress war's applications, gap, war.
# ctf-cycle = 120,600,60
# arena-cycle = 120,600
# fortress-cycle = 300,60,1800
# fortress-structure-hp = 0
# bandit-seconds = 60,60
# guild-election-seconds = 600
# guild-war-end-seconds = 60
